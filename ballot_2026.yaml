    "summary": "Proposition A is a $535 million general obligation bond to retrofit, repair, and expand San Francisco's disaster-response infrastructure. The money is split roughly as: up to $200M to replace the Potrero Muni bus storage/maintenance yard (which houses buses used to move emergency workers), up to $130M to expand and strengthen the high-pressure Emergency Firefighting Water System (especially the under-served Westside/Richmond/Sunset), up to $100M for fire-station seismic retrofits, up to $72M for police-station improvements, and up to $33M for other disaster-response facilities. It is the fourth ESER bond since 2010 (after $412M in 2010, $400M in 2014, and $628.5M in 2020). As a GO bond it is repaid through property taxes; the city says total repayment with interest would be about $933M over ~25 years. The Board of Supervisors placed it on the ballot 11-0. It needs a two-thirds (66.67%) supermajority to pass.",
