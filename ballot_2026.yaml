    "summary": "A San Francisco charter amendment on the June 2, 2026 ballot that would convert the city's existing term limits for the Mayor and the Board of Supervisors from a \"two consecutive terms\" limit into a \"two terms for life\" limit. Today, an official can serve two consecutive four-year terms, sit out four years, and then run for the same office again. Prop B would cap each office at two four-year terms over a person's entire lifetime, whether served consecutively or not. It passed the Board of Supervisors 7-4 on February 3, 2026, to qualify for the ballot, and needs a simple majority (50%+1) to become law. The City Controller certified it would have no cost to government. The measure has become a high-profile, lopsidedly funded fight: roughly $342,000-$352,000 was raised in support (largely from tech billionaires Chris Larsen and Michael Moritz, with Nick Josefowitz and Jerome Guillen among committee backers via the \"Term Limits Now - Yes on B!\" committee) versus under $3,000 in organized opposition, even though the opposition has assembled a broad coalition of labor, Democratic clubs, former mayors, and good-government groups. Critics widely view it as aimed at one person: former Supervisor Aaron Peskin, the only official to return to the board after terming out since SF adopted limits in 1990.",
