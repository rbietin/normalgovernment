    "whats_at_stake": "The lieutenant governor is California's No. 2 official: the office holder becomes acting governor when the governor is out of state, breaks ties in the state Senate, and sits on powerful boards (UC Board of Regents, CSU Board of Trustees, State Lands Commission, Ocean Protection Council). The job has limited day-to-day power and is often called a stepping stone, but it is a first-in-line backstop to the governorship and a platform on higher-education, coastal/land, and economic-mobility policy. The seat is open in 2026 because incumbent Eleni Kounalakis is termed out and running for governor. Whoever wins this heavily Democratic-leaning office becomes an immediate contender for future statewide office.",
    "how_to_think": "This is a wide-open, low-information race for an office most voters can't define, so name recognition, money, and institutional backing matter more than usual. In deep-blue California, the realistic question is which two Democrats advance (and whether the lone major Republican, Gloria Romero, grabs the second slot by consolidating the GOP vote while Democrats split). Decide what you value: deep statewide executive/financial experience (Ma), Newsom-establishment continuity and a service/volunteerism record (Fryday), or a nationally known progressive anti-poverty profile (Tubbs). Weigh Ma's experience against a settled $350,000 state-paid harassment lawsuit; weigh Fryday's money and Newsom endorsement against low name recognition; weigh Tubbs's celebrity and union backing against the fact that he lost his last election and has never held statewide office.",
