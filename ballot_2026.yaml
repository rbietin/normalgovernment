    "whats_at_stake": "The Board of Equalization (BOE) is one of California's least-understood elected offices. Once a powerful tax agency that collected roughly a third of state revenue, it was gutted in 2017 after audits exposed members misusing staff and funds; the Legislature stripped most of its duties and handed them to two new agencies. Today the elected BOE has a narrow constitutional job: overseeing county property-tax assessment practices, setting the taxable value of utility and railroad property, and hearing certain tax appeals. Property taxes it helps oversee generated about $100 billion in 2024-25, funding schools and local governments. The seat pays roughly $184,000 a year. District 2 covers 19 counties from the Bay Area up and down the coast (north of Los Angeles), including San Francisco. The central debate this cycle: should the office be reformed, abolished, or used as a taxpayer-advocacy platform? Critics say the job is a part-time, high-paying springboard for politicians; defenders say it is a useful forum for taxpayers.",
    "how_to_think": "This is functionally a Democrat-vs-Democrat contest in a heavily Democratic district, with four Republicans splitting the GOP vote. The realistic question is whether incumbent Sally Lieber and challenger John Pimentel both advance to November (likely), or whether a Republican sneaks into second. Voters who like the board as a low-profile taxpayer forum and value institutional/party continuity lean Lieber. Voters who want to shrink or abolish the office, or who want a reform-minded outsider, lean Pimentel. The Republicans (Marymee, Shireman, McComas, Zaruka) offer fiscal-conservative messaging but lack the funding and Democratic-district math to be favored. Note that ideology matters less here than for most offices: the board's actual powers are narrow, so candidate philosophy about the board's very existence is the sharpest distinction.",
