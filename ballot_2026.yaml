    "how_to_think": "Because the district is overwhelmingly Democratic, the practical question on June 2 is which two of the three leading Democrats advance to November. State Sen. Scott Wiener is the clear front-runner with the most institutional support, name recognition, and the California Democratic Party endorsement; he is essentially certain to take one slot. The real contest is for the second slot between Connie Chan (Pelosi- and labor-backed local progressive) and Saikat Chakrabarti (self-funding national progressive who has spent roughly $10 million of his own money). Voters choosing here are really weighing: proven legislative track record vs. movement-style confrontation; how to tax the wealthy (Wiener opposes the state billionaire tax that both rivals back); and whether they want an insider coalition-builder or an outsider disruptor. Consider each candidate's actual record and outcomes, not just slogans, and remember a vote here is mostly about who you want to see in the November runoff.",
