    "how_to_think": "This is a low-information, fragmented race: in PPIC polling no candidate cracked the low double digits and about 32% of voters were undecided weeks before the primary, with the leaders clustered around 7%. There is no true frontrunner, so the realistic decision is which two candidates advance to November. Money and institutional muscle matter more than usual here. The single biggest force is the California Teachers Association, which has poured over $5 million in independent expenditures behind Richard Barrera; no superintendent has won in 44 years without CTA backing. Against that, Anthony Rendon leads in candidate-controlled cash (nearly $1.2M, much carried over from a treasurer race) and name recognition, and Al Muratsuchi has deep labor and legislative endorsements. Decide first whether you want a hands-on district practitioner (Barrera), a seasoned but baggage-carrying legislative leader (Rendon), an education-policy legislator (Muratsuchi), or a protest/values vote. Note the partisan splinter risk: with several Democratic-aligned candidates dividing the left-of-center vote, conservative Sonja Shaw (CA Republican Party, Moms for Liberty) could grab a top-two spot. Weigh outcomes (what each actually accomplished) over campaign slogans, and remember the office's real but limited powers.",
