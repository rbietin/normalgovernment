    "office": "San Francisco Board of Education (one seat, remainder of a term ending January 8, 2027)",
    "election_type": "Nonpartisan local special election held on the June 2, 2026 statewide primary ballot. Decided by MAJORITY, not plurality: a candidate must win more than 50% of the vote to win outright in June. If no one clears 50%, the top two finishers advance to a runoff on the November 3, 2026 general election ballot. (Note: this is NOT ranked-choice — SF stopped using RCV for school board seats; it is a majority-or-runoff system for this partial-term special.)",
    "whats_at_stake": "This single seat fills the rest of Lainie Motamedi's term (ending Jan. 8, 2027). The winner shapes a district in crisis: SFUSD just closed a roughly $100 million budget deficit, weathered its first teachers' strike in ~50 years (a four-day February 2026 walkout settled with a $183M deal), and is fighting over whether to close under-enrolled schools as enrollment keeps falling. The race is effectively a referendum on the moderate, Lurie/Breed-appointed board majority vs. the teachers' union and progressive wing. Because it is a partial term, the same candidates can also run in November 2026 for full four-year seats, so June is partly a positioning fight.",
    "how_to_think": "This is a three-way contest with a clear ideological split. Phil Kim is the incumbent board president backed by Mayor Lurie, the SF Chronicle, the Democratic Party (DCCC), and moderate/parent groups; he represents continuity and a focus on fiscal stability and test scores, and is open to eventual school closures. Virginia Cheung is the teachers'-union (UESF) and progressive-aligned challenger, an early-childhood/nonprofit leader who emphasizes equity and \"cradle to career,\" and is the strongest threat to deny Kim a majority. Brandee Marckmann is the most explicitly anti-closure, anti-\"privatization\" progressive, drawing the further-left endorsements (Preston, Fielder, Peskin). Ask yourself: do you want to keep the current board's direction (Kim), shift toward an educator/union-backed equity agenda (Cheung), or send a protest against school closures and \"billionaire\" influence (Marckmann)? Also weigh that Cheung and Marckmann split the progressive vote, which helps Kim avoid a runoff — but a strong combined left vote could force a November rematch.",
    "candidates": [
      {
        "name": "Phil Kim",
        "tier": "frontrunner",
        "party": "Nonpartisan (Democrat); moderate-aligned",
        "current_role": "President, SFUSD Board of Education (incumbent); deputy director/chief of staff at the SF Human Rights Commission",
        "background": "Former 7th-grade science teacher who came to California through Teach for America; worked as a teacher and administrator in the KIPP NorCal charter network and led STEM programs across many states and schools. Holds a master's in education policy and is pursuing a doctorate in education. Grew up the child of South Korean immigrants near Detroit. Appointed to the board in August 2024 by then-Mayor London Breed to fill Lainie Motamedi's vacated seat, and unanimously elected board president by colleagues in January 2026. Running to keep the seat for the first time as an incumbent.",
        "key_positions": [
          "Prioritizes measurable academic outcomes (reading/math) and keeping educators central to board decisions",
          "Frames his ~18 months as 'stabilizing' the district: closing the ~$100M deficit and settling the teachers' strike",
          "Open to eventually closing/consolidating under-enrolled schools to address thousands of empty seats, but wants a credible plan",
          "Supports expanding competitive programs (e.g., language immersion) to retain families and reverse enrollment decline",
          "Emphasizes fiscal sustainability and pushing the state for more education funding"
        ],
        "track_record": [
