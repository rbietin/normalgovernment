    "whats_at_stake": "This is the only contested judicial race on San Francisco's June ballot. The seat is open because Judge Gerardo Sandoval chose not to run for reelection (he drew criticism in 2025 for releasing a theft suspect pretrial over prosecutors' objections). The contest pits a longtime city prosecutor against a longtime public defender, making it a small-scale referendum on San Francisco's public-safety politics. The winner serves a six-year term deciding criminal pretrial release, sentencing, diversion eligibility, and civil matters. Both candidates were rated \"Well-Qualified\" by the Bar Association of San Francisco, so the choice is less about competence than about professional perspective and judicial temperament.",
    "how_to_think": "Judicial-ethics rules bar candidates from promising how they will rule, so neither runs on policy platforms; the meaningful signal is their professional background, who is funding and endorsing them, and how they describe their judicial approach. Maffei is the prosecutor backed by police unions, tech donors, the SF Chronicle, the local Democratic Party, and centrist/moderate groups, and she has a large money advantage. Pray is the public defender backed by progressive clubs, several sitting judges, and small-dollar donors. Both stress impartiality and \"treating each case individually.\" Consider which professional lens and set of backers you want on the bench, and note that the losing candidate could still end up a judge by gubernatorial appointment.",
